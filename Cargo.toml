[workspace]
resolver = "3"
members = ["crates/ratelimit", "crates/ratelimit-proto"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
jiff = "0.2"
pin-project-lite = "0.2"
fred = { version = "10.1", default-features = false, features = ["credential-provider", "i-keys", "i-scripts", "i-server", "unix-sockets"] }
prost = "0.14"
prost-types = "0.14"
protox = "0.10"
regex = "1"
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
tonic = { version = "0.14", features = ["gzip", "tls-native-roots", "tls-ring"] }
tower = { version = "0.5", features = ["util"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
base64 = "0.22"
getrandom = "0.4"
http = "1"
http-body = "1"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
bytes = "1"
flate2 = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
inotify = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
xxhash-rust = { version = "0.8", features = ["xxh64"] }
yaml-rust2 = "0.13"
ratelimit-proto = { path = "crates/ratelimit-proto" }
