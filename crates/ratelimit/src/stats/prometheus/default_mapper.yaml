# Requires statsd exporter >= v0.6.0 since it uses the "drop" action.
mappings:
  # A list limit's `~name` (D29) in a `limit` label: not upstream's. Upstream's globs would
  # take a one-key list limit first, so they are rewritten as the regexes they are equivalent
  # to, after these. The deeper rule is unanchored at its end like upstream's own deeper rules,
  # which are kept as they are: `over_limit_with_local_cache` counts in `over_limit` there.
  - match: "^ratelimit\\.service\\.rate_limit\\.([^.]*)\\.([^.]*)~([0-9A-Za-z][0-9A-Za-z_-]*)\\.(near_limit|over_limit|total_hits|within_limit|shadow_mode|opened_without_hits)$"
    match_type: regex
    name: "ratelimit_service_rate_limit_$4"
    timer_type: "histogram"
    labels:
      domain: "$1"
      key1: "$2"
      limit: "$3"
  - match: "^ratelimit\\.service\\.rate_limit\\.([^.]*)\\.([^.]*)\\.([^.]*)(\\.[^.]*)*~([0-9A-Za-z][0-9A-Za-z_-]*)\\.(near_limit|over_limit|total_hits|within_limit|shadow_mode|opened_without_hits)"
    match_type: regex
    name: "ratelimit_service_rate_limit_$6"
    timer_type: "histogram"
    labels:
      domain: "$1"
      key1: "$2"
      key2: "$3"
      limit: "$5"

  - match: "^ratelimit\\.service\\.rate_limit\\.([^.]*)\\.([^.]*)\\.near_limit$"
    match_type: regex
    name: "ratelimit_service_rate_limit_near_limit"
    timer_type: "histogram"
    labels:
      domain: "$1"
      key1: "$2"
  - match: "^ratelimit\\.service\\.rate_limit\\.([^.]*)\\.([^.]*)\\.over_limit$"
    match_type: regex
    name: "ratelimit_service_rate_limit_over_limit"
    timer_type: "histogram"
    labels:
      domain: "$1"
      key1: "$2"
  - match: "^ratelimit\\.service\\.rate_limit\\.([^.]*)\\.([^.]*)\\.total_hits$"
    match_type: regex
    name: "ratelimit_service_rate_limit_total_hits"
    timer_type: "histogram"
    labels:
      domain: "$1"
      key1: "$2"
  - match: "^ratelimit\\.service\\.rate_limit\\.([^.]*)\\.([^.]*)\\.within_limit$"
    match_type: regex
    name: "ratelimit_service_rate_limit_within_limit"
    timer_type: "histogram"
    labels:
      domain: "$1"
      key1: "$2"
  - match: "^ratelimit\\.service\\.rate_limit\\.([^.]*)\\.([^.]*)\\.shadow_mode$"
    match_type: regex
    name: "ratelimit_service_rate_limit_shadow_mode"
    timer_type: "histogram"
    labels:
      domain: "$1"
      key1: "$2"

  - match: "ratelimit\\.service\\.rate_limit\\.([^\\.]*)\\.([^\\.]*)\\.([^\\.]*)(\\..*)?\\.near_limit"
    match_type: regex
    name: "ratelimit_service_rate_limit_near_limit"
    timer_type: "histogram"
    labels:
      domain: "$1"
      key1: "$2"
      key2: "$3"
  - match: "ratelimit\\.service\\.rate_limit\\.([^\\.]*)\\.([^\\.]*)\\.([^\\.]*)(\\..*)?\\.over_limit"
    match_type: regex
    name: "ratelimit_service_rate_limit_over_limit"
    timer_type: "histogram"
    labels:
      domain: "$1"
      key1: "$2"
      key2: "$3"
  - match: "ratelimit\\.service\\.rate_limit\\.([^\\.]*)\\.([^\\.]*)\\.([^\\.]*)(\\..*)?\\.total_hits"
    match_type: regex
    name: "ratelimit_service_rate_limit_total_hits"
    timer_type: "histogram"
    labels:
      domain: "$1"
      key1: "$2"
      key2: "$3"
  - match: "ratelimit\\.service\\.rate_limit\\.([^\\.]*)\\.([^\\.]*)\\.([^\\.]*)(\\..*)?\\.within_limit"
    match_type: regex
    name: "ratelimit_service_rate_limit_within_limit"
    timer_type: "histogram"
    labels:
      domain: "$1"
      key1: "$2"
      key2: "$3"
  - match: "ratelimit\\.service\\.rate_limit\\.([^\\.]*)\\.([^\\.]*)\\.([^\\.]*)(\\..*)?\\.shadow_mode"
    match_type: regex
    name: "ratelimit_service_rate_limit_shadow_mode"
    timer_type: "histogram"
    labels:
      domain: "$1"
      key1: "$2"
      key2: "$3"

  - match: "ratelimit.service.call.should_rate_limit.*"
    name: "ratelimit_service_should_rate_limit_error"
    match_metric_type: counter
    labels:
      err_type: "$1"

  - match: "ratelimit_server.*.total_requests"
    name: "ratelimit_service_total_requests"
    match_metric_type: counter
    labels:
      grpc_method: "$1"
  - match: "ratelimit_server.*.response_time"
    name: "ratelimit_service_response_time_seconds"
    timer_type: histogram
    scale: 0.001
    labels:
      grpc_method: "$1"

  - match: "ratelimit.service.config_load_success"
    name: "ratelimit_service_config_load_success"
    match_metric_type: counter
  - match: "ratelimit.service.config_load_error"
    name: "ratelimit_service_config_load_error"
    match_metric_type: counter

  # The quota lookup (ADR 0003): not upstream's.
  - match: "ratelimit.quota_lookup.error.*"
    name: "ratelimit_quota_lookup_errors"
    match_metric_type: counter
    labels:
      cause: "$1"
  - match: "ratelimit.quota_lookup.response_time"
    name: "ratelimit_quota_lookup_response_time_seconds"
    timer_type: histogram
    scale: 0.001
