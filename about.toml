# cargo-about's configuration (docs/design.md D34): the licenses of the crates the image's
# binary is built from, for its two targets, written to THIRD-PARTY-LICENSES.txt.
accepted = [
    "Apache-2.0",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
