name: Release

# A `v*` tag publishes the image for linux/amd64 and linux/arm64 to ghcr.io, with an SBOM and
# provenance, signed with cosign (keyless, GitHub's OIDC identity), then a GitHub release with
# the tag's CHANGELOG.md section. A pull request touching the image builds the same,
# attestations included, without publishing.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/release.yml

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ratelimit

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          # Without publishing, the image and its attestations go to a local OCI layout.
          outputs: ${{ env.PUBLISH == 'true' && 'type=registry' || 'type=oci,dest=/tmp/image.tar' }}
          cache-from: |
            type=gha,scope=linux/amd64
            type=gha,scope=linux/arm64
      - if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Sign the image
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Check the attestations
        if: env.PUBLISH != 'true'
        run: |
          mkdir /tmp/image && tar -xf /tmp/image.tar -C /tmp/image
          # The index lists both platforms and an attestation manifest for each.
          index=$(jq -r '.manifests[0].digest' /tmp/image/index.json | cut -d: -f2)
          jq -e '[.manifests[].platform.architecture] | (index("amd64") and index("arm64"))' \
            "/tmp/image/blobs/sha256/$index"
          jq -e '[.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")]
            | length == 2' "/tmp/image/blobs/sha256/$index"

  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish the release with its changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The lines under "## [<version>]", up to the next "## [" heading.
          awk -v v="${TAG#v}" '
            /^## \[/ { section = index($0, "## [" v "]") == 1; next }
            /^\[[^]]*\]: / { section = 0 }
            section
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::no CHANGELOG.md section for $TAG"; exit 1; }
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
