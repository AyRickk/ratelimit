name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      # Differential tests compare against envoyproxy/ratelimit (tools/oracle); fail if they cannot run.
      RATELIMIT_REQUIRE_DIFFERENTIAL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/oracle/go.mod
          cache-dependency-path: tools/oracle/go.sum
      - name: Install Redis
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: |
          cargo fmt --all --check
          test -z "$(gofmt -l tools/oracle)"
      - name: Lint
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          (cd tools/oracle && go vet ./...)
      - name: Test
        run: cargo test --workspace
