name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: rust (${{ matrix.server }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The differential tests run envoyproxy/ratelimit and this implementation against each.
        server: [redis, valkey]
    env:
      # Differential tests compare against envoyproxy/ratelimit (tools/oracle); fail if they cannot run.
      RATELIMIT_REQUIRE_DIFFERENTIAL: "1"
      VALKEY_VERSION: 9.1.2
      VALKEY_SHA256: 0d2a79936cbafa5f527a5175536bb17bd3f767f95f53529e59dddfacf762eec0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: tools/oracle/go.mod
          cache-dependency-path: tools/oracle/go.sum
      - name: Install Redis
        if: matrix.server == 'redis'
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - name: Install Valkey
        if: matrix.server == 'valkey'
        run: |
          archive="valkey-${VALKEY_VERSION}-noble-x86_64"
          curl -sSfLO "https://download.valkey.io/releases/${archive}.tar.gz"
          echo "${VALKEY_SHA256}  ${archive}.tar.gz" | sha256sum --check
          tar -xzf "${archive}.tar.gz"
          echo "RATELIMIT_REDIS_SERVER=$PWD/${archive}/bin/valkey-server" >> "$GITHUB_ENV"
      - name: Install memcached
        run: sudo apt-get update && sudo apt-get install -y memcached
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format
        run: |
          cargo fmt --all --check
          test -z "$(gofmt -l tools/oracle)"
      - name: Lint
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          (cd tools/oracle && go vet ./...)
      - name: Test
        run: cargo test --workspace

  image:
    name: image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: ratelimit:ci
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Test the image against upstream's
        env:
          RATELIMIT_IMAGE: ratelimit:ci
        run: cargo test -p ratelimit --test image

  envoy-gateway:
    name: envoy-gateway
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      KIND_VERSION: v0.33.0
      KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          # Envoy Gateway's chart reads REGISTRY/REPOSITORY:TAG.
          tags: localhost/ratelimit:ci
          cache-from: type=gha,scope=linux/amd64
      - name: Install kind
        run: |
          curl -sSfLo kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  kind" | sha256sum --check
          sudo install kind /usr/local/bin/kind
      - name: Envoy Gateway with our image, against upstream's
        run: tools/envoy-gateway/test.sh localhost/ratelimit:ci
