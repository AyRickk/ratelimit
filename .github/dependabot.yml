# Version updates for the crates, the workflows' actions and the image's base images. The
# Go module in tools/oracle is left out: it pins upstream at the commit this project matches.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
    groups:
      cargo:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
    ignore:
      # Rust moves with rust-version and CI's toolchain, on purpose; digests still update.
      - dependency-name: docker.io/library/rust
        update-types: [version-update:semver-minor, version-update:semver-major]
